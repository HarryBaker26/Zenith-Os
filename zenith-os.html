<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenithOS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0812;
  --bg-deep2:#140f22;
  --panel:rgba(24,19,38,0.64);
  --panel-solid:#161029;
  --border:rgba(255,236,214,0.10);
  --text:#F5EFE6;
  --muted:#9A8FA8;
  --gold:#FFB648;
  --amber:#FF8A3D;
  --coral:#FF5E7A;
  --violet:#8B6CFF;
  --ice:#5FD8FF;
  --accent:var(--gold);
  --accent2:var(--coral);
  --accent3:var(--violet);
  --radius:18px;
  --font-head:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --dock-size:54px;
  --blur:22px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased;background:#000;}
#root{width:100vw;height:100vh;position:relative;background:var(--bg-deep);}
.hidden{display:none !important;}
::selection{background:var(--accent);color:#100b1c;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.22);}
button{font-family:var(--font-body);cursor:pointer;}
input,textarea{font-family:var(--font-body);}

/* ============================= BOOT ============================= */
#boot{position:absolute;inset:0;z-index:9999;background:#000;overflow:hidden;transition:opacity 0.9s ease;}
#boot.hide{opacity:0;pointer-events:none;}

.boot-sky{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 45% at 50% 62%, rgba(255,138,61,0.20), transparent 70%),
  linear-gradient(to bottom, #05030a 0%, #0d0819 40%, #170f28 68%, #201432 100%);
}
.boot-stars{position:absolute;inset:0 0 40% 0;}
.boot-stars span{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:starTwinkle 3s ease-in-out infinite;}
@keyframes starTwinkle{0%,100%{opacity:.1;}50%{opacity:.8;}}

.boot-horizon{position:absolute;left:0;right:0;bottom:0;height:42%;overflow:hidden;}
.boot-peaks{position:absolute;bottom:0;left:0;width:100%;height:100%;}
.boot-peaks path{fill:#050208;}
.boot-peaks .p2{fill:#0a0512;opacity:0.85;}
.boot-peaks .p3{fill:#0e0818;opacity:0.7;}

.boot-sun{position:absolute;left:50%;bottom:20%;width:120px;height:120px;margin-left:-60px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #FFE3B0, var(--gold) 45%, var(--coral) 100%);
  box-shadow:0 0 80px 20px rgba(255,182,72,0.45), 0 0 200px 60px rgba(255,94,122,0.18);
  animation:sunRise 3.6s cubic-bezier(.22,.9,.3,1) forwards;
  animation-delay:0.2s;
  transform:translateY(160px);
  opacity:0;
}
@keyframes sunRise{
  0%{opacity:0;transform:translateY(160px) scale(0.7);}
  20%{opacity:1;}
  100%{opacity:1;transform:translateY(-70px) scale(1);}
}
.boot-sun-rays{position:absolute;left:50%;bottom:20%;width:400px;height:400px;margin-left:-200px;margin-bottom:-140px;
  background:conic-gradient(from 0deg, rgba(255,182,72,0.28), rgba(255,94,122,0.14), rgba(139,108,255,0.14), rgba(255,182,72,0.28));
  border-radius:50%;filter:blur(30px);opacity:0;animation:rayIn 3s ease forwards;animation-delay:0.6s;
  animation-name:rayIn, raySpin; animation-duration:3s, 14s; animation-timing-function:ease, linear; animation-iteration-count:1, infinite;
}
@keyframes rayIn{0%{opacity:0;}100%{opacity:0.55;}}
@keyframes raySpin{to{transform:rotate(360deg);}}

.boot-mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-64%);width:96px;height:96px;opacity:0;
  animation:markIn 1.4s cubic-bezier(.2,.85,.25,1) forwards;animation-delay:2.0s;
  filter:drop-shadow(0 0 30px rgba(255,182,72,0.5));z-index:5;}
@keyframes markIn{0%{opacity:0;transform:translate(-50%,-64%) scale(0.6) rotate(-6deg);}
  60%{opacity:1;transform:translate(-50%,-64%) scale(1.08) rotate(1deg);}
  100%{opacity:1;transform:translate(-50%,-64%) scale(1) rotate(0);}}

.boot-word{position:absolute;top:50%;left:50%;transform:translate(-50%, 6px);text-align:center;z-index:5;width:100%;}
.boot-word h1{font-family:var(--font-head);font-weight:800;font-size:42px;letter-spacing:0.22em;margin:0;
  background:linear-gradient(90deg,#fff,var(--gold) 60%,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;animation:wordIn 1.4s ease forwards;animation-delay:2.7s;}
@keyframes wordIn{0%{opacity:0;letter-spacing:0.5em;}100%{opacity:1;letter-spacing:0.22em;}}
.boot-word p{font-family:var(--font-mono);font-size:11px;letter-spacing:0.4em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;
  opacity:0;animation:wordIn 1.2s ease forwards;animation-delay:3.15s;}

.boot-console{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);width:380px;max-width:82vw;
  font-family:var(--font-mono);font-size:11.5px;color:var(--gold);opacity:0;animation:consoleIn 0.6s ease forwards;animation-delay:3.5s;
  text-shadow:0 0 10px rgba(255,182,72,0.3);z-index:5;}
@keyframes consoleIn{to{opacity:0.92;}}
.boot-console .ln{opacity:0;animation:lnIn 0.3s ease forwards;margin-bottom:5px;display:flex;justify-content:space-between;gap:10px;}
.boot-console .ln span:last-child{color:var(--muted);}
@keyframes lnIn{to{opacity:1;}}

.boot-progress{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:280px;max-width:70vw;z-index:5;
  opacity:0;animation:consoleIn 0.6s ease forwards;animation-delay:3.5s;}
.boot-progress-track{height:3px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;}
.boot-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--coral),var(--violet));
  box-shadow:0 0 12px rgba(255,182,72,0.5);transition:width .25s ease;}
.boot-progress-pct{margin-top:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:0.1em;}

.boot-flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20;pointer-events:none;animation:flashKf 1s ease forwards;animation-delay:5.7s;}
@keyframes flashKf{0%{opacity:0;}45%{opacity:1;}100%{opacity:0;}}

/* ============================= LOGIN ============================= */
#login{position:absolute;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0c0817 0%,#150f26 45%,#1c1330 100%);overflow:hidden;}
.login-glow{position:absolute;inset:-10%;background:
  radial-gradient(circle at 20% 20%, rgba(255,182,72,0.18), transparent 40%),
  radial-gradient(circle at 82% 78%, rgba(139,108,255,0.18), transparent 45%),
  radial-gradient(circle at 70% 15%, rgba(255,94,122,0.12), transparent 40%);
  animation:loginDrift 16s ease-in-out infinite alternate;filter:blur(10px);}
@keyframes loginDrift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-2%,2%) scale(1.06);}}
.login-clock{position:absolute;top:54px;left:50%;transform:translateX(-50%);text-align:center;z-index:2;}
.login-clock .t{font-family:var(--font-head);font-weight:700;font-size:56px;letter-spacing:0.02em;}
.login-clock .d{font-family:var(--font-body);font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:0.05em;}
.login-card{position:relative;z-index:2;width:320px;padding:38px 30px 30px;border-radius:24px;
  background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--border);
  box-shadow:0 30px 80px rgba(0,0,0,0.5);text-align:center;
  opacity:0;transform:translateY(18px) scale(0.98);animation:cardIn 0.9s cubic-bezier(.2,.85,.25,1) forwards;animation-delay:0.2s;}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}
.login-avatar{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;
  background:conic-gradient(from 210deg, var(--gold), var(--coral), var(--violet), var(--gold));
  display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:26px;
  box-shadow:0 0 0 3px rgba(255,255,255,0.08), 0 0 40px rgba(255,182,72,0.25);}
.login-name{font-family:var(--font-head);font-weight:700;font-size:18px;margin-bottom:18px;}
.login-input-wrap{position:relative;margin-bottom:14px;}
.login-input{width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,0.05);color:var(--text);font-size:14px;outline:none;transition:border-color .2s, box-shadow .2s;}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,182,72,0.15);}
.login-go{position:absolute;right:5px;top:5px;bottom:5px;width:32px;border-radius:9px;border:none;
  background:linear-gradient(135deg,var(--gold),var(--coral));color:#160e08;font-weight:700;display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease;}
.login-go:hover{transform:scale(1.08);}
.login-hint{font-size:11.5px;color:var(--muted);letter-spacing:0.03em;}
.login-shake{animation:loginShake 0.4s ease;}
@keyframes loginShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.login-bottom{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:22px;z-index:2;}
.login-bottom button{background:none;border:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:0.85;transition:opacity .2s, color .2s;}
.login-bottom button:hover{opacity:1;color:var(--text);}
.login-bottom .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;}

/* ============================= DESKTOP ============================= */
#desktop{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 0.8s ease;}
#desktop.show{opacity:1;}
.wallpaper{position:absolute;inset:0;z-index:0;background:linear-gradient(160deg,var(--bg-deep) 0%,var(--bg-deep2) 55%,#1a1128 100%);overflow:hidden;}
.wallpaper .wglow{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.5;}
.wallpaper .g1{width:46vw;height:46vw;top:-14vw;right:-10vw;background:radial-gradient(circle,var(--accent),transparent 70%);animation:wglowFloat 22s ease-in-out infinite;}
.wallpaper .g2{width:38vw;height:38vw;bottom:-14vw;left:-8vw;background:radial-gradient(circle,var(--accent3),transparent 70%);animation:wglowFloat 26s ease-in-out infinite reverse;}
.wallpaper .g3{width:26vw;height:26vw;bottom:6vw;right:14vw;background:radial-gradient(circle,var(--accent2),transparent 70%);opacity:0.3;animation:wglowFloat 19s ease-in-out infinite;}
@keyframes wglowFloat{0%,100%{transform:translate(0,0);}50%{transform:translate(-4%,4%);}}
.wallpaper .wpeaks{position:absolute;bottom:0;left:0;width:100%;height:34%;opacity:0.55;}
.wallpaper .wpeaks path{fill:rgba(0,0,0,0.35);}

.topbar{position:absolute;top:0;left:0;right:0;height:42px;z-index:500;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(10,8,18,0.45);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  font-size:13px;}
.topbar-left{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:600;}
.topbar-left .zmark{width:18px;height:18px;}
.topbar-mid{position:absolute;left:50%;transform:translateX(-50%);color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:0.03em;}
.topbar-right{display:flex;align-items:center;gap:14px;color:var(--muted);}
.topbar-right button{background:none;border:none;color:var(--muted);font-size:14px;padding:4px;border-radius:6px;transition:background .15s,color .15s;}
.topbar-right button:hover{background:rgba(255,255,255,0.08);color:var(--text);}

.dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:600;display:flex;align-items:flex-end;
  gap:10px;padding:10px 14px;border-radius:22px;background:var(--panel);backdrop-filter:blur(var(--blur));border:1px solid var(--border);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);}
.dock-item{position:relative;width:var(--dock-size);height:var(--dock-size);border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:24px;cursor:pointer;transition:transform 0.18s cubic-bezier(.3,1.5,.5,1), background .2s;background:rgba(255,255,255,0.045);
  border:1px solid rgba(255,255,255,0.05);}
.dock-item:hover{transform:translateY(-10px) scale(1.14);background:rgba(255,255,255,0.09);}
.dock-item .dot{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);
  opacity:0;transition:opacity .2s;}
.dock-item.running .dot{opacity:1;}
.dock-sep{width:1px;height:36px;background:var(--border);align-self:center;margin:0 2px;}

.windows-layer{position:absolute;inset:0;z-index:100;}
.window{position:absolute;min-width:340px;min-height:220px;border-radius:16px;overflow:hidden;
  background:var(--panel-solid);border:1px solid var(--border);box-shadow:0 30px 70px rgba(0,0,0,0.55);
  display:flex;flex-direction:column;opacity:0;transform:scale(0.92) translateY(16px);
  animation:winIn 0.35s cubic-bezier(.2,.9,.3,1.15) forwards;}
@keyframes winIn{to{opacity:1;transform:scale(1) translateY(0);}}
.window.closing{animation:winOut 0.22s ease forwards;}
@keyframes winOut{to{opacity:0;transform:scale(0.94) translateY(10px);}}
.window.focused{box-shadow:0 30px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,182,72,0.25);}
.win-titlebar{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);cursor:move;user-select:none;}
.win-dots{display:flex;gap:7px;}
.win-dots span{width:11px;height:11px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent;}
.win-dots .close{background:#FF5F57;}
.win-dots .min{background:#FEBC2E;}
.win-dots .max{background:#28C840;}
.win-dots span:hover{color:rgba(0,0,0,0.55);}
.win-title{font-size:12.5px;font-weight:600;color:var(--muted);font-family:var(--font-head);}
.win-body{flex:1;overflow:auto;position:relative;}
.win-resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;}

/* app shells */
.app-pad{padding:18px;height:100%;overflow:auto;}
.app-h1{font-family:var(--font-head);font-weight:700;font-size:18px;margin:0 0 4px;}
.app-sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;}
.card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:14px;}
.btn{background:linear-gradient(135deg,var(--gold),var(--coral));border:none;color:#160e08;font-weight:700;
  padding:9px 16px;border-radius:10px;font-size:13px;transition:transform .15s;}
.btn:hover{transform:translateY(-1px);}
.btn.ghost{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);font-weight:600;}

/* Files app */
.files-wrap{display:flex;height:100%;}
.files-side{width:150px;flex:none;border-right:1px solid var(--border);padding:14px 8px;}
.files-side .fitem{padding:8px 10px;border-radius:9px;font-size:13px;display:flex;gap:8px;align-items:center;color:var(--muted);transition:background .15s,color .15s;}
.files-side .fitem.active,.files-side .fitem:hover{background:rgba(255,182,72,0.12);color:var(--text);}
.files-main{flex:1;padding:16px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px;align-content:start;}
.file-tile{text-align:center;font-size:11.5px;color:var(--muted);cursor:default;}
.file-tile .fic{font-size:34px;margin-bottom:6px;}
.file-tile:hover{color:var(--text);}

/* Notes */
.notes-wrap{display:flex;height:100%;}
.notes-list{width:160px;flex:none;border-right:1px solid var(--border);overflow:auto;}
.note-row{padding:11px 12px;border-bottom:1px solid var(--border);font-size:12.5px;cursor:pointer;}
.note-row.active{background:rgba(255,182,72,0.12);}
.note-row b{display:block;font-size:12.5px;margin-bottom:3px;}
.note-row span{color:var(--muted);font-size:11px;}
.notes-editor{flex:1;display:flex;flex-direction:column;}
.notes-editor textarea{flex:1;border:none;background:transparent;color:var(--text);padding:16px;font-size:13.5px;
  resize:none;outline:none;line-height:1.6;font-family:var(--font-body);}
.notes-editor-top{display:flex;justify-content:flex-end;padding:8px 10px;border-bottom:1px solid var(--border);}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px;}
.cal-grid .dow{color:var(--muted);font-size:10.5px;padding-bottom:4px;}
.cal-grid .cell{padding:9px 0;border-radius:9px;}
.cal-grid .cell.today{background:linear-gradient(135deg,var(--gold),var(--coral));color:#160e08;font-weight:700;}
.cal-events{margin-top:16px;}
.cal-event{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:12.5px;}
.cal-event .dotc{width:8px;height:8px;border-radius:50%;flex:none;}

/* Theme studio */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.theme-swatch{border-radius:14px;padding:14px;cursor:pointer;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .15s;}
.theme-swatch:hover{transform:translateY(-2px);}
.theme-swatch.active{outline:2px solid var(--gold);}
.theme-swatch .bar{height:34px;border-radius:8px;margin-bottom:8px;}
.theme-swatch .nm{font-size:12px;font-weight:600;}
.custom-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
.custom-row input[type=color]{width:38px;height:28px;border:none;border-radius:8px;background:none;padding:0;cursor:pointer;}
.theme-actions{display:flex;gap:10px;margin-top:16px;}

/* AI Assistant */
.ai-wrap{display:flex;flex-direction:column;height:100%;}
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);}
.ai-head .orb{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),var(--coral),var(--violet),var(--gold));
  animation:orbSpin 4s linear infinite;flex:none;}
@keyframes orbSpin{to{transform:rotate(360deg);}}
.ai-head b{font-family:var(--font-head);font-size:13.5px;}
.ai-head span{display:block;font-size:10.5px;color:var(--muted);}
.ai-messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.ai-msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.5;}
.ai-msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--gold),var(--coral));color:#160e08;border-bottom-right-radius:4px;}
.ai-msg.bot{align-self:flex-start;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-bottom-left-radius:4px;white-space:pre-wrap;}
.ai-typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:rgba(255,255,255,0.06);border-radius:14px;border-bottom-left-radius:4px;}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typingDot 1.2s ease-in-out infinite;}
.ai-typing span:nth-child(2){animation-delay:0.2s;}
.ai-typing span:nth-child(3){animation-delay:0.4s;}
@keyframes typingDot{0%,60%,100%{opacity:0.3;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}
.ai-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
.ai-input-row input{flex:1;padding:10px 14px;border-radius:24px;border:1px solid var(--border);background:rgba(255,255,255,0.05);
  color:var(--text);font-size:13px;outline:none;}
.ai-input-row input:focus{border-color:var(--accent);}
.ai-input-row button{width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--gold),var(--coral));
  color:#160e08;font-weight:700;flex:none;}
.ai-suggest{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 12px;}
.ai-suggest button{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);border-radius:16px;padding:6px 12px;font-size:11.5px;}
.ai-suggest button:hover{color:var(--text);border-color:var(--accent);}

/* Settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);font-size:13px;}
.set-row:last-child{border-bottom:none;}
.toggle{width:42px;height:24px;border-radius:14px;background:rgba(255,255,255,0.12);position:relative;cursor:pointer;transition:background .2s;flex:none;}
.toggle.on{background:linear-gradient(135deg,var(--gold),var(--coral));}
.toggle .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;}
.toggle.on .knob{transform:translateX(18px);}

/* Notifications toast */
.toast-layer{position:absolute;top:52px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:10px;}
.toast{width:280px;padding:12px 14px;border-radius:14px;background:var(--panel);backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);box-shadow:0 16px 40px rgba(0,0,0,0.4);font-size:12.5px;
  opacity:0;transform:translateX(20px);animation:toastIn .35s ease forwards;}
@keyframes toastIn{to{opacity:1;transform:translateX(0);}}
.toast b{font-family:var(--font-head);font-size:12.5px;display:block;margin-bottom:2px;}
.toast span{color:var(--muted);}
.toast.leaving{animation:toastOut .3s ease forwards;}
@keyframes toastOut{to{opacity:0;transform:translateX(20px);}}

@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001s !important; transition-duration:0.001s !important;} }
</style>

<script>
/* ============================= BOOT SEQUENCE ============================= */
(function(){
  const starsWrap = document.getElementById('bootStars');
  for(let i=0;i<70;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*60+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    starsWrap.appendChild(s);
  }
  const lines = [
    ['core.sys','loaded'],
    ['summit-kernel','v5.1'],
    ['apex.assistant','initializing'],
    ['theme-engine','ready'],
    ['display-compositor','60fps'],
    ['user-session','preparing']
  ];
  const consoleEl = document.getElementById('bootConsole');
  lines.forEach((l,i)=>{
    const div=document.createElement('div');
    div.className='ln';
    div.style.animationDelay=(3.6+i*0.22)+'s';
    div.innerHTML=`<span>${l[0]}</span><span>${l[1]}</span>`;
    consoleEl.appendChild(div);
  });
  const fill=document.getElementById('bootFill'), pct=document.getElementById('bootPct');
  let p=0;
  const iv=setInterval(()=>{
    p+=Math.random()*14+4;
    if(p>=100){p=100;clearInterval(iv);}
    fill.style.width=p+'%';
    pct.textContent=Math.floor(p)+'%';
  },220);

  setTimeout(()=>{
    document.getElementById('boot').classList.add('hide');
    setTimeout(()=>{
      document.getElementById('boot').style.display='none';
      showLogin();
    },900);
  },6300);
})();

/* ============================= LOGIN ============================= */
function updateLoginClock(){
  const now=new Date();
  document.getElementById('loginTime').textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  document.getElementById('loginDate').textContent = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
}
function showLogin(){
  document.getElementById('login').classList.remove('hidden');
  updateLoginClock();
  setInterval(updateLoginClock, 1000*30);
  document.getElementById('loginPass').focus();
}
function attemptLogin(){
  const card=document.getElementById('loginCard');
  card.classList.add('login-shake');
  setTimeout(()=>{
    document.getElementById('login').style.transition='opacity 0.6s ease';
    document.getElementById('login').style.opacity='0';
    setTimeout(()=>{
      document.getElementById('login').classList.add('hidden');
      const desk=document.getElementById('desktop');
      desk.classList.remove('hidden');
      requestAnimationFrame(()=>desk.classList.add('show'));
      startClock();
      setTimeout(()=>pushToast('Welcome to ZenithOS','Everything is up to date and ready to go.'),700);
    },600);
  },260);
}
document.getElementById('loginGo').addEventListener('click', attemptLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') attemptLogin(); });

/* ============================= TOP CLOCK ============================= */
function startClock(){
  function tick(){
    const now=new Date();
    document.getElementById('topClock').textContent = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  tick(); setInterval(tick,1000);
}

/* ============================= TOASTS ============================= */
function pushToast(title, body){
  const layer=document.getElementById('toastLayer');
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<b>${title}</b><span>${body}</span>`;
  layer.appendChild(t);
  setTimeout(()=>{
    t.classList.add('leaving');
    setTimeout(()=>t.remove(),320);
  },4200);
}

/* ============================= WINDOW MANAGER ============================= */
let zTop=10;
const openWindows={};
function focusWindow(id){
  document.querySelectorAll('.window').forEach(w=>w.classList.remove('focused'));
  const w=document.getElementById('win-'+id);
  if(!w) return;
  zTop++; w.style.zIndex=zTop; w.classList.add('focused');
  document.getElementById('topAppName').textContent = appDefs[id].name;
}
function closeWindow(id){
  const w=document.getElementById('win-'+id);
  if(!w) return;
  w.classList.add('closing');
  setTimeout(()=>{ w.remove(); delete openWindows[id];
    const dockItem=document.querySelector(`.dock-item[data-app="${id}"]`);
    if(dockItem) dockItem.classList.remove('running');
    document.getElementById('topAppName').textContent='ZenithOS';
  },220);
}
function makeDraggable(win, handle){
  let ox,oy,sx,sy,dragging=false;
  handle.addEventListener('mousedown', e=>{
    if(e.target.closest('.win-dots')) return;
    dragging=true; focusWindow(win.dataset.app);
    ox=e.clientX; oy=e.clientY;
    sx=win.offsetLeft; sy=win.offsetTop;
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    win.style.left=(sx+e.clientX-ox)+'px';
    win.style.top=Math.max(42,sy+e.clientY-oy)+'px';
  });
  document.addEventListener('mouseup', ()=>{ dragging=false; document.body.style.userSelect=''; });
}
function makeResizable(win, handle){
  let ox,oy,sw,sh,resizing=false;
  handle.addEventListener('mousedown', e=>{
    resizing=true; ox=e.clientX; oy=e.clientY; sw=win.offsetWidth; sh=win.offsetHeight; e.stopPropagation();
  });
  document.addEventListener('mousemove', e=>{
    if(!resizing) return;
    win.style.width=Math.max(340, sw+e.clientX-ox)+'px';
    win.style.height=Math.max(220, sh+e.clientY-oy)+'px';
  });
  document.addEventListener('mouseup', ()=>resizing=false);
}

function openApp(id){
  if(openWindows[id]){ focusWindow(id); return; }
  const def=appDefs[id];
  const layer=document.getElementById('windowsLayer');
  const win=document.createElement('div');
  win.className='window'; win.id='win-'+id; win.dataset.app=id;
  const posOffset=Object.keys(openWindows).length*26;
  win.style.left=(120+posOffset)+'px';
  win.style.top=(76+posOffset)+'px';
  win.style.width=def.w+'px'; win.style.height=def.h+'px';
  win.innerHTML=`
    <div class="win-titlebar">
      <div class="win-dots">
        <span class="close" onclick="closeWindow('${id}')"></span>
        <span class="min" onclick="closeWindow('${id}')"></span>
        <span class="max"></span>
      </div>
      <div class="win-title">${def.icon} ${def.name}</div>
    </div>
    <div class="win-body" id="body-${id}"></div>
    <div class="win-resize"></div>
  `;
  layer.appendChild(win);
  makeDraggable(win, win.querySelector('.win-titlebar'));
  makeResizable(win, win.querySelector('.win-resize'));
  win.addEventListener('mousedown', ()=>focusWindow(id));
  openWindows[id]=true;
  focusWindow(id);
  const dockItem=document.querySelector(`.dock-item[data-app="${id}"]`);
  if(dockItem) dockItem.classList.add('running');
  def.render(document.getElementById('body-'+id));
}

const appDefs = {
  files:{name:'Files', icon:'\uD83D\uDCC1', w:560, h:380, render:renderFiles},
  notes:{name:'Notes', icon:'\uD83D\uDCDD', w:520, h:400, render:renderNotes},
  calendar:{name:'Calendar', icon:'\uD83D\uDCC5', w:420, h:440, render:renderCalendar},
  apex:{name:'APEX Assistant', icon:'\u2726', w:400, h:520, render:renderApex},
  theme:{name:'Theme Studio', icon:'\uD83C\uDFA8', w:480, h:520, render:renderTheme},
  settings:{name:'Settings', icon:'\u2699\uFE0F', w:420, h:420, render:renderSettings},
};

/* ============================= FILES APP ============================= */
function renderFiles(el){
  const folders=[
    {name:'Documents', files:['Notes.txt','Resume.pdf','Budget.xlsx']},
    {name:'Media', files:['sunrise.png','peak-drone.mp4','soundscape.mp3']},
    {name:'Projects', files:['ZenithOS','theme-drafts','apex-prompts']},
    {name:'Downloads', files:['installer.dmg','wallpaper-pack.zip']},
  ];
  let active=0;
  el.innerHTML=`<div class="files-wrap">
    <div class="files-side" id="filesSide"></div>
    <div class="files-main" id="filesMain"></div>
  </div>`;
  function draw(){
    document.getElementById('filesSide').innerHTML = folders.map((f,i)=>
      `<div class="fitem ${i===active?'active':''}" onclick="window.__filesSelect(${i})">\uD83D\uDCC2 ${f.name}</div>`).join('');
    document.getElementById('filesMain').innerHTML = folders[active].files.map(f=>{
      const isFolder = !f.includes('.');
      const icon = isFolder ? '\uD83D\uDCC1' : (f.match(/\.(png|jpg|mp4)$/) ? '\uD83D\uDDBC\uFE0F' : f.match(/mp3/) ? '\uD83C\uDFB5' : '\uD83D\uDCC4');
      return `<div class="file-tile"><div class="fic">${icon}</div>${f}</div>`;
    }).join('');
  }
  window.__filesSelect = i=>{ active=i; draw(); };
  draw();
}

/* ============================= NOTES APP ============================= */
function renderNotes(el){
  let notes = JSON.parse(localStorage.getItem('zenithNotes')||'null') || [
    {title:'Welcome to Zenith', body:'This is your notes app. Click + to add a new note. Everything saves automatically.'},
  ];
  let active=0;
  el.innerHTML=`<div class="notes-wrap">
    <div class="notes-list" id="notesList"></div>
    <div class="notes-editor">
      <div class="notes-editor-top"><button class="btn ghost" onclick="window.__noteAdd()">+ New</button></div>
      <textarea id="noteBody"></textarea>
    </div>
  </div>`;
  function save(){ localStorage.setItem('zenithNotes', JSON.stringify(notes)); }
  function drawList(){
    document.getElementById('notesList').innerHTML = notes.map((n,i)=>
      `<div class="note-row ${i===active?'active':''}" onclick="window.__noteSelect(${i})">
        <b>${(n.title||'Untitled').slice(0,22)}</b><span>${(n.body||'').slice(0,30)||'No content'}</span>
      </div>`).join('');
  }
  function drawEditor(){
    const ta=document.getElementById('noteBody');
    ta.value = notes[active].body;
    ta.oninput = ()=>{
      notes[active].body = ta.value;
      notes[active].title = ta.value.split('\n')[0].slice(0,30) || 'Untitled';
      save(); drawList();
    };
  }
  window.__noteSelect = i=>{ active=i; drawList(); drawEditor(); };
  window.__noteAdd = ()=>{ notes.unshift({title:'Untitled', body:''}); active=0; save(); drawList(); drawEditor(); };
  drawList(); drawEditor();
}

/* ============================= CALENDAR APP ============================= */
function renderCalendar(el){
  const now=new Date();
  const year=now.getFullYear(), month=now.getMonth(), today=now.getDate();
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  let cells = ['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<firstDay;i++) cells+='<div></div>';
  for(let d=1; d<=daysInMonth; d++) cells+=`<div class="cell ${d===today?'today':''}">${d}</div>`;
  el.innerHTML=`<div class="app-pad">
    <div class="app-h1">${monthNames[month]} ${year}</div>
    <div class="app-sub">Today is ${monthNames[month]} ${today}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-events">
      <div class="cal-event"><div class="dotc" style="background:var(--gold);"></div>Team sync — 10:00 AM</div>
      <div class="cal-event"><div class="dotc" style="background:var(--coral);"></div>Design review — 2:30 PM</div>
      <div class="cal-event"><div class="dotc" style="background:var(--violet);"></div>Ship ZenithOS beta — 5:00 PM</div>
    </div>
  </div>`;
}

/* ============================= THEME STUDIO ============================= */
const presetThemes = [
  {id:'golden', name:'Golden Zenith', accent:'#FFB648', accent2:'#FF5E7A', accent3:'#8B6CFF', bg:'#0a0812', bg2:'#140f22'},
  {id:'arctic', name:'Arctic Summit', accent:'#5FD8FF', accent2:'#8B6CFF', accent3:'#B8F1FF', bg:'#070c14', bg2:'#0e1b2a'},
  {id:'ember',  name:'Ember Ridge',  accent:'#FF8A3D', accent2:'#FF3D5A', accent3:'#FFD166', bg:'#120705', bg2:'#1f0e08'},
  {id:'violet', name:'Midnight Peak', accent:'#8B6CFF', accent2:'#FF5E7A', accent3:'#5FD8FF', bg:'#0a0714', bg2:'#160f2a'},
  {id:'mint',   name:'Alpine Mint', accent:'#3FE0B0', accent2:'#5FD8FF', accent3:'#FFB648', bg:'#050f0d', bg2:'#0c1c19'},
  {id:'rose',   name:'Coral Ridge', accent:'#FF5E7A', accent2:'#FFB648', accent3:'#FF8A3D', bg:'#120810', bg2:'#1e0f1b'},
];
function applyTheme(t){
  const r=document.documentElement.style;
  r.setProperty('--accent', t.accent);
  r.setProperty('--accent2', t.accent2);
  r.setProperty('--accent3', t.accent3);
  r.setProperty('--gold', t.accent);
  r.setProperty('--coral', t.accent2);
  r.setProperty('--violet', t.accent3);
  r.setProperty('--bg-deep', t.bg);
  r.setProperty('--bg-deep2', t.bg2);
  localStorage.setItem('zenithTheme', JSON.stringify(t));
}
function renderTheme(el){
  const saved = JSON.parse(localStorage.getItem('zenithTheme')||'null');
  const customThemes = JSON.parse(localStorage.getItem('zenithCustomThemes')||'[]');
  const allThemes = presetThemes.concat(customThemes);
  let activeId = saved ? saved.id : 'golden';
  el.innerHTML=`<div class="app-pad">
    <div class="app-h1">Theme Studio</div>
    <div class="app-sub">Pick a preset or design your own. Applies instantly across ZenithOS.</div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="card">
      <div style="font-weight:600;font-size:13px;margin-bottom:6px;">Build a custom theme</div>
      <div class="custom-row"><span>Primary accent</span><input type="color" id="cAccent" value="#FFB648"></div>
      <div class="custom-row"><span>Secondary accent</span><input type="color" id="cAccent2" value="#FF5E7A"></div>
      <div class="custom-row"><span>Tertiary accent</span><input type="color" id="cAccent3" value="#8B6CFF"></div>
      <div class="custom-row"><span>Background</span><input type="color" id="cBg" value="#0A0812"></div>
      <div class="theme-actions">
        <input class="login-input" id="cName" placeholder="Name this theme…" style="flex:1;">
        <button class="btn" onclick="window.__saveCustomTheme()">Save theme</button>
      </div>
    </div>
  </div>`;
  function draw(){
    document.getElementById('themeGrid').innerHTML = allThemes.map(t=>`
      <div class="theme-swatch ${t.id===activeId?'active':''}" onclick="window.__applyThemeById('${t.id}')">
        <div class="bar" style="background:linear-gradient(135deg,${t.accent},${t.accent2},${t.accent3});"></div>
        <div class="nm">${t.name}</div>
      </div>`).join('');
  }
  window.__applyThemeById = id=>{
    const t = allThemes.find(x=>x.id===id);
    if(!t) return;
    activeId=id; applyTheme(t); draw();
    pushToast('Theme applied', t.name+' is now active.');
  };
  window.__saveCustomTheme = ()=>{
    const name = document.getElementById('cName').value.trim() || 'My Theme';
    const t = {
      id:'custom-'+Date.now(),
      name,
      accent: document.getElementById('cAccent').value,
      accent2: document.getElementById('cAccent2').value,
      accent3: document.getElementById('cAccent3').value,
      bg: document.getElementById('cBg').value,
      bg2: document.getElementById('cBg').value,
    };
    customThemes.push(t);
    localStorage.setItem('zenithCustomThemes', JSON.stringify(customThemes));
    allThemes.push(t);
    activeId=t.id; applyTheme(t); draw();
    pushToast('Custom theme saved', name+' has been added to your library.');
  };
  draw();
  if(saved) applyTheme(saved);
}

/* ============================= APEX AI ASSISTANT ============================= */
let apexHistory = [];
function renderApex(el){
  el.innerHTML=`<div class="ai-wrap">
    <div class="ai-head">
      <div class="orb"></div>
      <div><b>APEX</b><span>Built into ZenithOS</span></div>
    </div>
    <div class="ai-messages" id="apexMessages"></div>
    <div class="ai-suggest" id="apexSuggest">
      <button onclick="window.__apexAsk('What can you help me with in ZenithOS?')">What can you do?</button>
      <button onclick="window.__apexAsk('Suggest a good theme for a focus session.')">Suggest a theme</button>
      <button onclick="window.__apexAsk('Give me a 3-step plan to organize my day.')">Plan my day</button>
    </div>
    <div class="ai-input-row">
      <input id="apexInput" placeholder="Ask APEX anything…" />
      <button onclick="window.__apexSend()">&#8593;</button>
    </div>
  </div>`;
  const msgs=document.getElementById('apexMessages');
  function drawHistory(){
    msgs.innerHTML = apexHistory.map(m=>`<div class="ai-msg ${m.role==='user'?'user':'bot'}">${escapeHtml(m.text)}</div>`).join('');
    msgs.scrollTop = msgs.scrollHeight;
  }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  if(apexHistory.length===0){
    apexHistory.push({role:'assistant', text:"Hey — I'm APEX, the assistant built into ZenithOS. Ask me about the OS, your day, or anything else on your mind."});
  }
  drawHistory();

  async function send(text){
    if(!text.trim()) return;
    apexHistory.push({role:'user', text});
    drawHistory();
    const typing=document.createElement('div');
    typing.className='ai-typing';
    typing.innerHTML='<span></span><span></span><span></span>';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;
    try{
      const apiMessages = apexHistory.map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system:"You are APEX, the built-in AI assistant of a fictional, stylish operating system called ZenithOS (tagline: reach the peak). Be warm, concise, and a little clever. Keep replies under 120 words unless asked for more detail.",
          messages: apiMessages
        })
      });
      const data = await response.json();
      const text = (data.content||[]).map(b=>b.text||'').join('\n').trim() || "I couldn't quite reach the summit on that one — try asking again.";
      typing.remove();
      apexHistory.push({role:'assistant', text});
      drawHistory();
    }catch(err){
      typing.remove();
      apexHistory.push({role:'assistant', text:"I'm having trouble connecting right now. Try again in a moment."});
      drawHistory();
    }
  }
  window.__apexSend = ()=>{
    const inp=document.getElementById('apexInput');
    const v=inp.value; inp.value='';
    send(v);
  };
  window.__apexAsk = (text)=>{ send(text); };
  document.getElementById('apexInput').addEventListener('keydown', e=>{ if(e.key==='Enter') window.__apexSend(); });
}

/* ============================= SETTINGS APP ============================= */
function renderSettings(el){
  const reduceMotion = localStorage.getItem('zenithReduceMotion')==='1';
  el.innerHTML=`<div class="app-pad">
    <div class="app-h1">Settings</div>
    <div class="app-sub">ZenithOS · Build 1.0 "Summit"</div>
    <div class="card">
      <div class="set-row"><span>Reduce motion</span><div class="toggle ${reduceMotion?'on':''}" id="toggleMotion"></div></div>
      <div class="set-row"><span>Open Theme Studio</span><button class="btn ghost" onclick="openApp('theme')">Open</button></div>
      <div class="set-row"><span>About ZenithOS</span><span style="color:var(--muted);">Peak performance, by design</span></div>
      <div class="set-row"><span>Storage</span><span style="color:var(--muted);">62% used</span></div>
    </div>
  </div>`;
  document.getElementById('toggleMotion').addEventListener('click', function(){
    const on = this.classList.toggle('on');
    localStorage.setItem('zenithReduceMotion', on?'1':'0');
    document.body.style.setProperty('--reduced', on?'1':'0');
    if(on){ document.documentElement.style.setProperty('scroll-behavior','auto'); }
    pushToast('Motion setting updated', on?'Animations reduced.':'Animations restored.');
  });
}

/* boot: apply any saved theme immediately so login/desktop match */
(function(){
  const saved = JSON.parse(localStorage.getItem('zenithTheme')||'null');
  if(saved) applyTheme(saved);
})();
</script>
